<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <title>UrbanNEST</title>
    <meta name="description" content="Find your perfect property in Ethiopia. Browse apartments, houses, and commercial spaces for rent or sale." />
    <meta name="keywords" content="real estate ethiopia, property for sale, apartments for rent, addis ababa property" />

    <!-- Open Graph -->
    <meta property="og:title" content="UrbanNEST | Find Your Perfect Property" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://urbannest.com" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#6366f1" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <div id="google_translate_element" style="position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden;"></div>
